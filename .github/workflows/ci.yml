name: Build OpenAL Soft (Linux)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Linux Release
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpulse-dev \
            portaudio19-dev \
            libasound2-dev \
            libjack-dev \
            libpipewire-0.3-dev \
            qt6-base-dev \
            libdbus-1-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_FLAGS="-Ofast -march=westmere -mtune=ivybridge -mfsgsbase -mxsave -mxsaveopt -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0" \
            -DCMAKE_CXX_FLAGS="-Ofast -march=westmere -mtune=ivybridge -mfsgsbase -mxsave -mxsaveopt -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0" \
            -DALSOFT_BACKEND_PIPEWIRE=ON \
            -DALSOFT_BACKEND_ALSA=OFF \
            -DALSOFT_BACKEND_PULSEAUDIO=OFF \
            -DALSOFT_BACKEND_JACK=OFF \
            -DALSOFT_BACKEND_OSS=OFF \
            -DALSOFT_BACKEND_PORTAUDIO=OFF \
            -DALSOFT_REQUIRE_RTKIT=ON \
            -DALSOFT_REQUIRE_ALSA=OFF \
            -DALSOFT_REQUIRE_OSS=OFF \
            -DALSOFT_REQUIRE_PORTAUDIO=OFF \
            -DALSOFT_REQUIRE_PULSEAUDIO=OFF \
            -DALSOFT_REQUIRE_JACK=OFF \
            -DALSOFT_REQUIRE_PIPEWIRE=ON \
            -DALSOFT_TESTS=OFF \
            -DALSOFT_EXAMPLES=OFF \
            -DALSOFT_UTILS=OFF \
            -DALSOFT_INSTALL=OFF \
            .

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      - name: Strip
        run: |
          strip build/libopenal.so

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libopenal-linux-x86_64
          path: build/libopenal.so

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/libopenal.so libopenal.so
          gh release create "${{ github.ref_name }}" \
            libopenal.so \
            --title "${{ github.ref_name }} - libopenal.so (x86_64)" \
            --generate-notes
